[project]
name = "scrollback"
version = "0.1.0"
description = "Personal inspiration engine over saved TikToks, Pinterest pins and Drive recipes"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "google-genai>=1.0",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.16",
  "google-api-python-client>=2.130",
  "google-auth>=2.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
scrollback-sync = "scrollback.sync:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scrollback*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
